name: Daily DA collection

on:
  schedule:
    - cron: "17 19 * * *"   # ~6am AEDT / 5am AEST
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-da

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The database lives on a separate `data` branch so history of the code stays clean
      # and we remember which DAs we have already seen.
      - name: Restore database
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show origin/data:das.sqlite > data/das.sqlite || rm -f data/das.sqlite
          fi

      - name: NSW Planning Portal (DA, CDC, CC)
        run: python sources/nsw_planning_portal.py

      - name: ACT DA Finder
        run: python sources/act_dafinder.py
        continue-on-error: true

      - name: SA PlanSA register
        run: python sources/sa_plansa.py
        continue-on-error: true

      - name: QLD councils (Development.i, Logan, Moreton Bay)
        run: python sources/qld_councils.py
        continue-on-error: true

      # Needs a repo secret called MONDAY_API_TOKEN (Settings > Secrets and variables > Actions).
      - name: Push matches to monday.com
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: |
          if [ -z "$MONDAY_API_TOKEN" ]; then
            echo "MONDAY_API_TOKEN not set - skipping monday push"; python filters.py 7
          else
            python push_monday.py
          fi

      - name: Save database
        run: |
          cd data
          git init -q -b data
          git config user.name "da-collector"
          git config user.email "da-collector@users.noreply.github.com"
          git add das.sqlite
          git commit -q -m "Data $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
